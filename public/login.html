
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimetableForge | Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-icon">T</div>
            <h1>TimetableForge</h1>
            <p>SMART UNIVERSITY SCHEDULING</p>
        </div>

        <div class="login-card">
            <div style="margin-bottom:25px">
                <p style="color:#635bdb;font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:9px">
                    YOUR ACADEMIC WORKSPACE
                </p>
                <h2 style="font-size:25px;margin-bottom:8px">Welcome Back</h2>
                <p style="color:#858ba3;font-size:13px">
                    Sign in to manage your university schedule.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="name@university.edu"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn" class="btn" style="width:100%;margin-top:12px">
                    Sign In →
                </button>

                <p id="loginMessage" role="alert" style="font-size:12px;margin-top:15px;text-align:center"></p>
            </form>

            <div style="border-top:1px solid #eeeef4;margin-top:20px;padding-top:18px;text-align:center">
                <p style="font-size:11px;color:#858ba3">
                    Secure access for Administrators, Faculty and Students
                </p>
            </div>
        </div>

        <footer>© 2026 TimetableForge · University Scheduling System</footer>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
